<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" role="img" aria-label="RenkuOS release model: a rolling trunk with nightly and weekly builds, and two dated releases a year, each preceded by a one-month stabilisation freeze taking bugfix cherry-picks only.">
<style>
  .panel{fill:#F1F4F4}
  .title{fill:#132020}
  .sub,.axis{fill:#3B4A49}
  .muted{fill:#6A7978}
  .grid{stroke:#D9DFDE;stroke-width:1}
  .trunk{stroke:#3B4A49;stroke-width:2.5;stroke-linecap:round}
  .tick{fill:#A9B5B4}
  .wk{fill:#0E6A62}
  .brline{stroke:#8F5A08;stroke-width:2.2;fill:none;stroke-linecap:round}
  .frz{fill:#8F5A08;fill-opacity:.10}
  .frzedge{stroke:#8F5A08;stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 3}
  .frztext{fill:#8F5A08}
  .cp{stroke:#8F5A08;stroke-width:1.4;fill:none;stroke-opacity:.75}
  .cphead{fill:#8F5A08;fill-opacity:.75}
  .relring{fill:#0E6A62}
  .relcore{fill:#F1F4F4}
  .relnum{fill:#0E6A62}
  @media (prefers-color-scheme:dark){
    .panel{fill:#0E1515}
    .title{fill:#E3EAE9}
    .sub,.axis{fill:#ADBCBA}
    .muted{fill:#7C8C8A}
    .grid{stroke:#2A3535}
    .trunk{stroke:#ADBCBA}
    .tick{fill:#4A5857}
    .wk{fill:#4FB6AA}
    .brline{stroke:#D5A244}
    .frz{fill:#D5A244;fill-opacity:.13}
    .frzedge{stroke:#D5A244;stroke-opacity:.4}
    .frztext{fill:#D5A244}
    .cp{stroke:#D5A244}
    .cphead{fill:#D5A244}
    .relring{fill:#4FB6AA}
    .relcore{fill:#0E1515}
    .relnum{fill:#4FB6AA}
  }
</style>
