<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="The coordinate model, drawn to scale. Display 1 is the primary, 2560 by 1440, with its top-left corner at 0,0. Display 2, 1920 by 1080, sits to its left at minus 1920, 360. Display 3, 1920 by 1080, sits to its right at 2560, minus 240. The dashed desktop frame is the bounding box of all three, and the parts of it no display shows are dead space. A window that is 62 percent on display 1 and 38 percent on display 3 is owned by display 1. The cursor crosses from display 1 to display 3 where their edges touch, and stops at the bottom edge of display 3 instead of entering dead space.">
<style>
  .panel{fill:#F1F4F4} .title{fill:#132020} .sub{fill:#3B4A49} .muted{fill:#6A7978}
  .d1{fill:#BFE3DD;stroke:#0E6A62;stroke-width:2}
  .d2{fill:#D5DFF2;stroke:#3B5B92;stroke-width:2}
  .d3{fill:#F6E4C2;stroke:#B7791F;stroke-width:2}
  .frame{fill:none;stroke:#6A7978;stroke-width:1.6;stroke-dasharray:8 5}
  .hatch{stroke:#B4BFBE;stroke-width:2}
  .deadbg{fill:#E7ECEB}
  .win{fill:#FFFFFF;stroke:#3B4A49;stroke-width:1.4}
  .tab{fill:#FFD43B;stroke:#3B4A49;stroke-width:1.2}
  .ok{stroke:#0E6A62;stroke-width:2.6;fill:none}
  .okhead{fill:#0E6A62}
  .stop{stroke:#9B2C2C;stroke-width:2.6;fill:none}
  .stopmark{stroke:#9B2C2C;stroke-width:3}
  .dot{fill:#132020}
  .card{fill:#FFFFFF;stroke:#B4BFBE;stroke-width:1.2}
  .num{fill:#0E6A62} .numText{fill:#FFFFFF}
  @media (prefers-color-scheme:dark){
    .panel{fill:#0E1515} .title{fill:#E3EAE9} .sub{fill:#ADBCBA} .muted{fill:#7C8C8A}
    .d1{fill:#1F4A44;stroke:#4FB6AA}
    .d2{fill:#24365A;stroke:#7F9FD6}
    .d3{fill:#4A3A1C;stroke:#D69E2E}
    .frame{stroke:#7C8C8A}
    .hatch{stroke:#3A4746}
    .deadbg{fill:#1A2424}
    .win{fill:#121B1B;stroke:#ADBCBA}
    .tab{fill:#C9A227;stroke:#ADBCBA}
    .ok{stroke:#4FB6AA} .okhead{fill:#4FB6AA}
    .stop{stroke:#F08A8A} .stopmark{stroke:#F08A8A}
    .dot{fill:#E3EAE9}
    .card{fill:#121B1B;stroke:#3A4746}
    .num{fill:#4FB6AA} .numText{fill:#0E1515}
  }
  text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
</style>
<defs>
  <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" class="hatch"/>
  </pattern>
  <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0L10 5L0 10z" class="okhead"/>
  </marker>
</defs>

<rect width="960" height="620" class="panel"/>
<text x="28" y="40" font-size="23" font-weight="700" class="title">The coordinate model</text>
<text x="28" y="64" font-size="15" class="sub">One coordinate space for the whole desktop, drawn to scale. Each display is a rectangle in it.</text>

<!-- dead space: the desktop frame minus the displays -->
<rect x="80" y="150" width="800" height="210" class="deadbg"/>
<rect x="80" y="150" width="800" height="210" fill="url(#h)"/>

<!-- displays -->
<rect x="80" y="225" width="240" height="135" class="d2"/>
<rect x="320" y="180" width="320" height="180" class="d1"/>
<rect x="640" y="150" width="240" height="135" class="d3"/>
<rect x="80" y="150" width="800" height="210" class="frame"/>

<text x="880" y="140" font-size="14" text-anchor="end" class="sub">desktop frame (bounding box)</text>
<text x="200" y="193" font-size="14" text-anchor="middle" class="sub">dead space</text>
<text x="760" y="327" font-size="14" text-anchor="middle" class="sub">dead space</text>

<!-- corner labels -->
<circle cx="320" cy="180" r="4" class="dot"/>
<text x="328" y="198" font-size="14" font-weight="700" class="title">(0, 0)</text>
<circle cx="80" cy="225" r="4" class="dot"/>
<text x="88" y="243" font-size="14" class="title">(−1920, 360)</text>
<circle cx="640" cy="150" r="4" class="dot"/>
<text x="648" y="168" font-size="14" class="title">(2560, −240)</text>

<!-- display names -->
<text x="200" y="300" font-size="15" font-weight="700" text-anchor="middle" class="title">Display 2</text>
<text x="200" y="320" font-size="13" text-anchor="middle" class="sub">1920 × 1080</text>
<text x="420" y="326" font-size="15" font-weight="700" text-anchor="middle" class="title">Display 1, primary</text>
<text x="420" y="346" font-size="13" text-anchor="middle" class="sub">2560 × 1440</text>
<text x="800" y="200" font-size="15" font-weight="700" text-anchor="middle" class="title">Display 3</text>
<text x="800" y="220" font-size="13" text-anchor="middle" class="sub">1920 × 1080</text>

<!-- straddling window -->
<rect x="540" y="200" width="160" height="56" class="win"/>
<rect x="540" y="186" width="74" height="14" class="tab"/>
<text x="546" y="197" font-size="10" class="title">Tracker</text>
<text x="620" y="226" font-size="12" text-anchor="middle" class="sub">62% on 1</text>
<text x="620" y="244" font-size="12" text-anchor="middle" class="sub">→ owned by 1</text>

<!-- cursor: crosses where edges touch -->
<path d="M560 274 H712" class="ok" marker-end="url(#ok)"/>
<!-- cursor: stops at the edge of dead space -->
<path d="M800 246 V283" class="stop"/>
<path d="M792 277 L808 293 M808 277 L792 293" class="stopmark"/>

<!-- legend -->
<rect x="28" y="388" width="18" height="14" class="deadbg"/><rect x="28" y="388" width="18" height="14" fill="url(#h)"/>
<text x="54" y="400" font-size="14" class="sub">dead space: inside the frame, on no display</text>
<path d="M370 395 H404" class="ok" marker-end="url(#ok)"/>
<text x="414" y="400" font-size="14" class="sub">cursor crosses where edges touch</text>
<path d="M680 386 L694 402 M694 386 L680 402" class="stopmark"/>
<text x="704" y="400" font-size="14" class="sub">cursor stops at the edge</text>

<!-- rules -->
<rect x="28" y="420" width="904" height="176" rx="8" class="card"/>
<g font-size="14" class="sub">
  <circle cx="54" cy="448" r="11" class="num"/><text x="54" y="453" font-size="13" font-weight="700" text-anchor="middle" class="numText">1</text>
  <text x="74" y="446">The primary display's top-left corner is (0, 0).</text>
  <text x="74" y="465">Other displays may sit at negative coordinates.</text>

  <circle cx="54" cy="498" r="11" class="num"/><text x="54" y="503" font-size="13" font-weight="700" text-anchor="middle" class="numText">2</text>
  <text x="74" y="496">Displays touch along an edge and never overlap.</text>
  <text x="74" y="515">Mirrored displays share one rectangle.</text>

  <circle cx="54" cy="548" r="11" class="num"/><text x="54" y="553" font-size="13" font-weight="700" text-anchor="middle" class="numText">3</text>
  <text x="74" y="546">A window belongs to the display that shows most</text>
  <text x="74" y="565">of it. A tie keeps the previous owner.</text>

  <circle cx="500" cy="448" r="11" class="num"/><text x="500" y="453" font-size="13" font-weight="700" text-anchor="middle" class="numText">4</text>
  <text x="520" y="446">The cursor crosses only where displays touch.</text>
  <text x="520" y="465">It never enters dead space.</text>

  <circle cx="500" cy="498" r="11" class="num"/><text x="500" y="503" font-size="13" font-weight="700" text-anchor="middle" class="numText">5</text>
  <text x="520" y="496">Windows may hang into dead space, as they hang</text>
  <text x="520" y="515">off-screen today. New windows never start there.</text>

  <circle cx="500" cy="548" r="11" class="num"/><text x="500" y="553" font-size="13" font-weight="700" text-anchor="middle" class="numText">6</text>
  <text x="520" y="546">BScreen(window).Frame() is the owner's rectangle,</text>
  <text x="520" y="565">in these coordinates.</text>
</g>
</svg>
