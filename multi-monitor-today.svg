<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="How Haiku drives displays today. Applications see one BScreen, and SetToNext always fails. In app_server the Desktop sends cursor, input, DPMS, and brightness through one hardware interface. VirtualScreen overwrites instead of adding screens, ScreenManager loads one accelerant, and every window is assigned to screen 0. The accelerant API has no display ID, only the first graphics card is opened, and the second head on the card stays dark. input_server clamps the cursor to one rectangle.">
<style>
  .panel{fill:#F1F4F4} .title{fill:#132020} .sub{fill:#3B4A49} .muted{fill:#6A7978}
  .tree{fill:#E7ECEB;stroke:#B4BFBE;stroke-width:1.2}
  .inner{fill:#FFFFFF;stroke:#B4BFBE;stroke-width:1.2}
  .stub{fill:#FBEDEC;stroke:#9B2C2C;stroke-width:1.6}
  .ghost{fill:none;stroke:#9AA6A5;stroke-width:1.4;stroke-dasharray:6 4}
  .hw{fill:#FFF6E8;stroke:#B7791F;stroke-width:1.4}
  .warn{fill:#9B2C2C} .accent{fill:#0A544E}
  .line{stroke:#6A7978;stroke-width:1.5;fill:none}
  .arrowhead{fill:#6A7978}
  .badge{fill:#9B2C2C} .badgeText{fill:#FFFFFF}
  .lit{fill:#9FD3CB;stroke:#0E6A62;stroke-width:1.4}
  .dark{fill:#2A3232;stroke:#6A7978;stroke-width:1.4}
  .stand{fill:#9AA6A5}
  @media (prefers-color-scheme:dark){
    .panel{fill:#0E1515} .title{fill:#E3EAE9} .sub{fill:#ADBCBA} .muted{fill:#7C8C8A}
    .tree{fill:#1A2424;stroke:#3A4746}
    .inner{fill:#121B1B;stroke:#3A4746}
    .stub{fill:#2E1717;stroke:#F08A8A}
    .ghost{stroke:#56625F}
    .hw{fill:#2B2214;stroke:#D69E2E}
    .warn{fill:#F08A8A} .accent{fill:#7FD3C8}
    .line{stroke:#7C8C8A} .arrowhead{fill:#7C8C8A}
    .badge{fill:#E06666} .badgeText{fill:#0E1515}
    .lit{fill:#1F5A53;stroke:#4FB6AA}
    .dark{fill:#060909;stroke:#56625F}
    .stand{fill:#56625F}
  }
  text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" class="arrowhead"/>
  </marker>
</defs>

<rect width="960" height="720" class="panel"/>
<text x="28" y="40" font-size="23" font-weight="700" class="title">Displays in Haiku today: one card, one head, one screen</text>
<text x="28" y="64" font-size="15" class="sub">The multi-screen types exist in app_server. Every place that would make a second screen work is a stub.</text>

<!-- legend -->
<rect x="28" y="80" width="15" height="15" rx="2" class="tree"/><text x="50" y="93" font-size="14" class="sub">works, single screen only</text>
<rect x="250" y="80" width="15" height="15" rx="2" class="stub"/><text x="272" y="93" font-size="14" class="sub">stub, or hard-wired to screen 0</text>
<rect x="500" y="80" width="15" height="15" rx="2" class="hw"/><text x="522" y="93" font-size="14" class="sub">hardware</text>
<rect x="626" y="80" width="15" height="15" rx="2" class="ghost"/><text x="648" y="93" font-size="14" class="sub">never used</text>

<!-- applications -->
<rect x="28" y="110" width="640" height="66" rx="8" class="tree"/>
<text x="46" y="134" font-size="16" font-weight="700" class="title">Applications (Interface Kit)</text>
<text x="46" y="157" font-size="14" class="sub">BScreen() and BScreen(window) both return the one screen.</text>
<rect x="436" y="124" width="216" height="40" rx="6" class="stub"/>
<text x="450" y="149" font-size="14" class="title">SetToNext() always fails</text>
<circle cx="640" cy="124" r="10" class="badge"/><text x="640" y="129" font-size="13" font-weight="700" text-anchor="middle" class="badgeText">1</text>

<line x1="348" y1="176" x2="348" y2="196" class="line" marker-end="url(#a)"/>

<!-- app_server -->
<rect x="28" y="198" width="640" height="252" rx="8" class="tree"/>
<text x="46" y="222" font-size="16" font-weight="700" class="title">app_server</text>

<rect x="46" y="236" width="186" height="64" rx="6" class="stub"/>
<text x="60" y="260" font-size="15" font-weight="700" class="title">Desktop</text>
<text x="60" y="280" font-size="13" class="sub">cursor, input, DPMS, and</text>
<text x="60" y="295" font-size="13" class="sub">brightness use one interface</text>
<circle cx="222" cy="236" r="10" class="badge"/><text x="222" y="241" font-size="13" font-weight="700" text-anchor="middle" class="badgeText">4</text>

<rect x="250" y="236" width="206" height="64" rx="6" class="stub"/>
<text x="264" y="260" font-size="15" font-weight="700" class="title">VirtualScreen</text>
<text x="264" y="280" font-size="13" class="sub">AddScreen() overwrites,</text>
<text x="264" y="295" font-size="13" class="sub">RemoveScreen() fails</text>
<circle cx="446" cy="236" r="10" class="badge"/><text x="446" y="241" font-size="13" font-weight="700" text-anchor="middle" class="badgeText">2</text>

<rect x="474" y="236" width="176" height="64" rx="6" class="inner"/>
<text x="488" y="260" font-size="15" font-weight="700" class="title">Screen 0</text>
<text x="488" y="280" font-size="13" class="sub">B_MAIN_SCREEN_ID, the</text>
<text x="488" y="295" font-size="13" class="sub">whole desktop</text>

<line x1="232" y1="268" x2="248" y2="268" class="line" marker-end="url(#a)"/>
<line x1="456" y1="268" x2="472" y2="268" class="line" marker-end="url(#a)"/>

<rect x="46" y="314" width="270" height="56" rx="6" class="stub"/>
<text x="60" y="337" font-size="15" font-weight="700" class="title">ScreenManager</text>
<text x="60" y="357" font-size="13" class="sub">the driver-scan loop runs once</text>
<circle cx="306" cy="314" r="10" class="badge"/><text x="306" y="319" font-size="13" font-weight="700" text-anchor="middle" class="badgeText">3</text>

<rect x="334" y="314" width="316" height="56" rx="6" class="inner"/>
<text x="348" y="337" font-size="15" font-weight="700" class="title">AccelerantHWInterface</text>
<text x="348" y="357" font-size="13" class="sub">RAM back buffer → front buffer, cursor</text>
<line x1="562" y1="300" x2="562" y2="312" class="line" marker-end="url(#a)"/>

<rect x="46" y="384" width="604" height="52" rx="6" class="stub"/>
<text x="60" y="406" font-size="15" font-weight="700" class="title">Window</text>
<text x="60" y="426" font-size="13" class="sub">bound to one DrawingEngine at creation. _DetermineScreenFor() always returns screen 0.</text>
<circle cx="640" cy="384" r="10" class="badge"/><text x="640" y="389" font-size="13" font-weight="700" text-anchor="middle" class="badgeText">5</text>

<line x1="492" y1="450" x2="492" y2="470" class="line" marker-end="url(#a)"/>

<!-- accelerant -->
<rect x="28" y="472" width="640" height="62" rx="8" class="stub"/>
<text x="46" y="496" font-size="16" font-weight="700" class="title">Accelerant (radeon_hd, intel_extreme, virtio …)</text>
<text x="46" y="518" font-size="13" class="sub">API version 1: no hook takes a display ID. radeon_hd uses CRTC 0; intel_extreme clones every port.</text>
<circle cx="658" cy="472" r="10" class="badge"/><text x="658" y="477" font-size="13" font-weight="700" text-anchor="middle" class="badgeText">6</text>

<line x1="180" y1="534" x2="180" y2="554" class="line" marker-end="url(#a)"/>

<!-- kernel -->
<rect x="28" y="556" width="306" height="50" rx="8" class="tree"/>
<text x="46" y="578" font-size="15" font-weight="700" class="title">/dev/graphics/…  first card</text>
<text x="46" y="597" font-size="13" class="sub">opened; vesa and framebuffer are fallbacks</text>
<rect x="352" y="556" width="316" height="50" rx="8" class="ghost"/>
<text x="370" y="578" font-size="15" font-weight="700" class="muted">/dev/graphics/…  second card</text>
<text x="370" y="597" font-size="13" class="muted">never opened</text>
<circle cx="658" cy="556" r="10" class="badge"/><text x="658" y="561" font-size="13" font-weight="700" text-anchor="middle" class="badgeText">7</text>

<line x1="180" y1="606" x2="180" y2="626" class="line" marker-end="url(#a)"/>

<!-- hardware -->
<rect x="28" y="628" width="640" height="66" rx="8" class="hw"/>
<text x="46" y="652" font-size="16" font-weight="700" class="title">GPU</text>
<rect x="110" y="640" width="210" height="42" rx="6" class="inner"/>
<text x="124" y="667" font-size="14" class="title">Head 0 → monitor A</text>
<rect x="336" y="640" width="316" height="42" rx="6" class="ghost"/>
<text x="350" y="667" font-size="14" class="muted">Head 1 → monitor B, left dark</text>

<!-- right column: input_server -->
<rect x="692" y="110" width="240" height="112" rx="8" class="stub"/>
<text x="710" y="134" font-size="16" font-weight="700" class="title">input_server</text>
<text x="710" y="158" font-size="13" class="sub">keeps one rectangle (fFrame)</text>
<text x="710" y="178" font-size="13" class="sub">clamps the cursor to it</text>
<text x="710" y="198" font-size="13" class="sub">scales tablets to it</text>

<!-- right column: where the stubs are -->
<rect x="692" y="238" width="240" height="292" rx="8" class="inner"/>
<text x="710" y="262" font-size="15" font-weight="700" class="title">Where the stubs are</text>
<g font-size="13" class="sub">
  <circle cx="716" cy="285" r="9" class="badge"/><text x="716" y="290" font-size="12" font-weight="700" text-anchor="middle" class="badgeText">1</text>
  <text x="734" y="290">ServerApp.cpp:2960</text>
  <circle cx="716" cy="318" r="9" class="badge"/><text x="716" y="323" font-size="12" font-weight="700" text-anchor="middle" class="badgeText">2</text>
  <text x="734" y="323">VirtualScreen.cpp:153, :165</text>
  <circle cx="716" cy="351" r="9" class="badge"/><text x="716" y="356" font-size="12" font-weight="700" text-anchor="middle" class="badgeText">3</text>
  <text x="734" y="356">ScreenManager.cpp:193</text>
  <circle cx="716" cy="384" r="9" class="badge"/><text x="716" y="389" font-size="12" font-weight="700" text-anchor="middle" class="badgeText">4</text>
  <text x="734" y="389">Desktop.cpp:580–613</text>
  <circle cx="716" cy="417" r="9" class="badge"/><text x="716" y="422" font-size="12" font-weight="700" text-anchor="middle" class="badgeText">5</text>
  <text x="734" y="422">Desktop.cpp:3476</text>
  <circle cx="716" cy="450" r="9" class="badge"/><text x="716" y="455" font-size="12" font-weight="700" text-anchor="middle" class="badgeText">6</text>
  <text x="734" y="455">Accelerant.h:19</text>
  <circle cx="716" cy="483" r="9" class="badge"/><text x="716" y="488" font-size="12" font-weight="700" text-anchor="middle" class="badgeText">7</text>
  <text x="734" y="488">AccelerantHWInterface.cpp:179</text>
</g>
<text x="710" y="516" font-size="12" class="muted">Paths in src/servers/app and headers/os</text>

<!-- monitors -->
<rect x="700" y="566" width="104" height="66" rx="4" class="lit"/>
<rect x="745" y="632" width="14" height="14" class="stand"/>
<rect x="726" y="646" width="52" height="5" rx="2" class="stand"/>
<text x="752" y="605" font-size="14" font-weight="700" text-anchor="middle" class="title">A</text>
<text x="752" y="674" font-size="13" text-anchor="middle" class="sub">desktop</text>

<rect x="822" y="566" width="104" height="66" rx="4" class="dark"/>
<rect x="867" y="632" width="14" height="14" class="stand"/>
<rect x="848" y="646" width="52" height="5" rx="2" class="stand"/>
<text x="874" y="605" font-size="14" font-weight="700" text-anchor="middle" class="muted">B</text>
<text x="874" y="674" font-size="13" text-anchor="middle" class="sub">dark</text>
<line x1="668" y1="661" x2="696" y2="620" class="line" marker-end="url(#a)"/>
</svg>
