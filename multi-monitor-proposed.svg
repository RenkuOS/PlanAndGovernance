<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-label="The proposed display stack. Applications keep the BScreen API: BScreen() is the primary display, BScreen(window) is the display that owns the window, and SetToNext enumerates displays. In app_server, VirtualScreen owns the layout and one canvas that every window draws into. Each Screen has its own front buffer and cursor. A layout store remembers layouts per set of monitors, and a hotplug watcher reacts to connector changes. Below, one AccelerantDevice per graphics card exposes heads. Drivers with the new head hooks get whole-configuration check and commit, per-head modes and EDID, and hotplug events. Older drivers are wrapped as a single head. input_server receives the list of display rectangles.">
<style>
  .panel{fill:#F1F4F4} .title{fill:#132020} .sub{fill:#3B4A49} .muted{fill:#6A7978}
  .tree{fill:#E7ECEB;stroke:#B4BFBE;stroke-width:1.2}
  .inner{fill:#FFFFFF;stroke:#B4BFBE;stroke-width:1.2}
  .changed{fill:#DDEFEC;stroke:#0E6A62;stroke-width:1.6}
  .new{fill:#FFFFFF;stroke:#0E6A62;stroke-width:1.8;stroke-dasharray:6 3}
  .hw{fill:#FFF6E8;stroke:#B7791F;stroke-width:1.4}
  .accent{fill:#0A544E}
  .line{stroke:#6A7978;stroke-width:1.5;fill:none}
  .arrowhead{fill:#6A7978}
  .lit{fill:#9FD3CB;stroke:#0E6A62;stroke-width:1.4}
  .lit2{fill:#C9D6EE;stroke:#3B5B92;stroke-width:1.4}
  .lit3{fill:#F3DDB3;stroke:#B7791F;stroke-width:1.4}
  .stand{fill:#9AA6A5}
  @media (prefers-color-scheme:dark){
    .panel{fill:#0E1515} .title{fill:#E3EAE9} .sub{fill:#ADBCBA} .muted{fill:#7C8C8A}
    .tree{fill:#1A2424;stroke:#3A4746}
    .inner{fill:#121B1B;stroke:#3A4746}
    .changed{fill:#12302D;stroke:#4FB6AA}
    .new{fill:#0E1515;stroke:#4FB6AA}
    .hw{fill:#2B2214;stroke:#D69E2E}
    .accent{fill:#7FD3C8}
    .line{stroke:#7C8C8A} .arrowhead{fill:#7C8C8A}
    .lit{fill:#1F5A53;stroke:#4FB6AA}
    .lit2{fill:#24365A;stroke:#7F9FD6}
    .lit3{fill:#4A3A1C;stroke:#D69E2E}
    .stand{fill:#56625F}
  }
  text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" class="arrowhead"/>
  </marker>
</defs>

<rect width="960" height="760" class="panel"/>
<text x="28" y="40" font-size="23" font-weight="700" class="title">Proposed: one desktop, many displays</text>
<text x="28" y="64" font-size="15" class="sub">Applications keep the same API. app_server draws once into a shared canvas. Drivers expose heads.</text>

<!-- legend -->
<rect x="28" y="80" width="15" height="15" rx="2" class="tree"/><text x="50" y="93" font-size="14" class="sub">unchanged</text>
<rect x="150" y="80" width="15" height="15" rx="2" class="changed"/><text x="172" y="93" font-size="14" class="sub">changed</text>
<rect x="256" y="80" width="15" height="15" rx="2" class="new"/><text x="278" y="93" font-size="14" class="sub">new</text>
<rect x="336" y="80" width="15" height="15" rx="2" class="hw"/><text x="358" y="93" font-size="14" class="sub">hardware</text>

<!-- applications -->
<rect x="28" y="110" width="660" height="80" rx="8" class="changed"/>
<text x="46" y="134" font-size="16" font-weight="700" class="title">Applications (Interface Kit, same ABI)</text>
<text x="46" y="157" font-size="14" class="sub">BScreen() is the primary display. BScreen(window) is the display that owns the window.</text>
<text x="46" y="178" font-size="14" class="sub">SetToNext() walks every display. New: BScreen::DesktopFrame() and IsPrimary().</text>

<line x1="358" y1="190" x2="358" y2="210" class="line" marker-end="url(#a)"/>

<!-- app_server -->
<rect x="28" y="212" width="660" height="300" rx="8" class="tree"/>
<text x="46" y="236" font-size="16" font-weight="700" class="title">app_server</text>

<rect x="46" y="250" width="150" height="56" rx="6" class="inner"/>
<text x="60" y="273" font-size="15" font-weight="700" class="title">Desktop</text>
<text x="60" y="293" font-size="13" class="sub">windows, workspaces</text>

<rect x="214" y="250" width="456" height="128" rx="6" class="changed"/>
<text x="228" y="273" font-size="15" font-weight="700" class="title">VirtualScreen</text>
<text x="228" y="293" font-size="13" class="sub">owns the layout: displays, positions, primary, mirrors</text>
<rect x="228" y="304" width="428" height="62" rx="6" class="new"/>
<text x="242" y="327" font-size="14" font-weight="700" class="title">Canvas: one RAM back buffer (B_RGBA32)</text>
<text x="242" y="347" font-size="13" class="sub">covers the desktop frame. Every window draws here once.</text>
<line x1="196" y1="278" x2="212" y2="278" class="line" marker-end="url(#a)"/>

<rect x="46" y="320" width="150" height="58" rx="6" class="new"/>
<text x="60" y="343" font-size="14" font-weight="700" class="title">Layout store</text>
<text x="60" y="363" font-size="13" class="sub">per monitor set</text>
<rect x="46" y="392" width="150" height="58" rx="6" class="new"/>
<text x="60" y="415" font-size="14" font-weight="700" class="title">Hotplug watcher</text>
<text x="60" y="435" font-size="13" class="sub">re-probe, re-apply</text>

<!-- screens -->
<rect x="214" y="392" width="142" height="104" rx="6" class="changed"/>
<text x="228" y="415" font-size="15" font-weight="700" class="title">Screen 0</text>
<text x="228" y="435" font-size="13" class="sub">primary</text>
<text x="228" y="455" font-size="13" class="sub">front buffer</text>
<text x="228" y="475" font-size="13" class="sub">cursor</text>
<rect x="371" y="392" width="142" height="104" rx="6" class="changed"/>
<text x="385" y="415" font-size="15" font-weight="700" class="title">Screen 1</text>
<text x="385" y="435" font-size="13" class="sub">front buffer</text>
<text x="385" y="455" font-size="13" class="sub">cursor</text>
<rect x="528" y="392" width="142" height="104" rx="6" class="changed"/>
<text x="542" y="415" font-size="15" font-weight="700" class="title">Screen 2</text>
<text x="542" y="435" font-size="13" class="sub">front buffer</text>
<text x="542" y="455" font-size="13" class="sub">cursor</text>
<line x1="285" y1="366" x2="285" y2="390" class="line" marker-end="url(#a)"/>
<line x1="442" y1="366" x2="442" y2="390" class="line" marker-end="url(#a)"/>
<line x1="599" y1="366" x2="599" y2="390" class="line" marker-end="url(#a)"/>
<text x="293" y="384" font-size="11" class="muted">copy + convert</text>

<line x1="358" y1="512" x2="358" y2="532" class="line" marker-end="url(#a)"/>

<!-- device layer -->
<rect x="28" y="534" width="660" height="118" rx="8" class="changed"/>
<text x="46" y="558" font-size="16" font-weight="700" class="title">AccelerantDevice: one per graphics card</text>
<rect x="46" y="570" width="372" height="68" rx="6" class="new"/>
<text x="60" y="592" font-size="14" font-weight="700" class="title">Head hooks (radeon_hd, intel_extreme, virtio)</text>
<text x="60" y="611" font-size="13" class="sub">per-head modes and EDID, whole-layout</text>
<text x="60" y="628" font-size="13" class="sub">check then commit, hotplug event</text>
<rect x="432" y="570" width="238" height="68" rx="6" class="inner"/>
<text x="446" y="592" font-size="14" font-weight="700" class="title">Version 1 drivers</text>
<text x="446" y="611" font-size="13" class="sub">vesa, framebuffer, older cards:</text>
<text x="446" y="628" font-size="13" class="sub">wrapped as a single head</text>

<line x1="232" y1="652" x2="232" y2="672" class="line" marker-end="url(#a)"/>

<!-- hardware -->
<rect x="28" y="674" width="660" height="62" rx="8" class="hw"/>
<text x="46" y="711" font-size="16" font-weight="700" class="title">GPU</text>
<rect x="106" y="686" width="180" height="38" rx="6" class="inner"/>
<text x="120" y="710" font-size="14" class="title">Head 0 → display 1</text>
<rect x="298" y="686" width="180" height="38" rx="6" class="inner"/>
<text x="312" y="710" font-size="14" class="title">Head 1 → display 2</text>
<rect x="490" y="686" width="180" height="38" rx="6" class="inner"/>
<text x="504" y="710" font-size="14" class="title">Head 2 → display 3</text>

<!-- right column -->
<rect x="712" y="110" width="220" height="132" rx="8" class="changed"/>
<text x="730" y="134" font-size="16" font-weight="700" class="title">input_server</text>
<text x="730" y="158" font-size="13" class="sub">receives the display</text>
<text x="730" y="176" font-size="13" class="sub">rectangles. The cursor</text>
<text x="730" y="194" font-size="13" class="sub">never enters dead space.</text>
<text x="730" y="216" font-size="13" class="sub">Tablets map to the desktop</text>
<text x="730" y="232" font-size="13" class="sub">or to one display.</text>
<path d="M690 300 H822 V246" class="line" marker-end="url(#a)"/>
<text x="712" y="290" font-size="12" class="muted">layout</text>

<rect x="712" y="330" width="220" height="166" rx="8" class="changed"/>
<text x="730" y="354" font-size="16" font-weight="700" class="title">System apps</text>
<text x="730" y="378" font-size="13" class="sub">Tracker desktop spans all</text>
<text x="730" y="396" font-size="13" class="sub">displays. Deskbar, Twitcher,</text>
<text x="730" y="414" font-size="13" class="sub">and notifications stay on</text>
<text x="730" y="432" font-size="13" class="sub">the primary. The screen</text>
<text x="730" y="450" font-size="13" class="sub">saver covers every display.</text>
<text x="730" y="476" font-size="13" class="sub">Screen prefs: drag to arrange.</text>

<!-- monitors -->
<g>
  <rect x="716" y="560" width="96" height="60" rx="4" class="lit"/>
  <rect x="757" y="620" width="14" height="12" class="stand"/>
  <rect x="740" y="632" width="48" height="5" rx="2" class="stand"/>
  <text x="764" y="595" font-size="14" font-weight="700" text-anchor="middle" class="title">1</text>
  <rect x="822" y="566" width="82" height="54" rx="4" class="lit2"/>
  <rect x="856" y="620" width="14" height="12" class="stand"/>
  <rect x="839" y="632" width="48" height="5" rx="2" class="stand"/>
  <text x="863" y="598" font-size="14" font-weight="700" text-anchor="middle" class="title">2</text>
  <rect x="716" y="660" width="82" height="50" rx="4" class="lit3"/>
  <rect x="750" y="710" width="14" height="10" class="stand"/>
  <rect x="733" y="720" width="48" height="5" rx="2" class="stand"/>
  <text x="757" y="690" font-size="14" font-weight="700" text-anchor="middle" class="title">3</text>
  <text x="822" y="684" font-size="13" class="sub">display 1 is</text>
  <text x="822" y="702" font-size="13" class="sub">the primary</text>
</g>
<line x1="688" y1="705" x2="710" y2="690" class="line" marker-end="url(#a)"/>
</svg>
